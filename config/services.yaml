# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    pagination_default_limit: 10
    public_dir: '%kernel.project_dir%/public/'
    word_image_upload_dir_relative: 'uploads/images/words/'
    word_image_upload_dir:      '%public_dir%%word_image_upload_dir_relative%'
    word_image_upload_dir_temp: '%word_image_upload_dir%temp/'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\EventListener\ApiExceptionListener:
        arguments:
          $environment: '%kernel.environment%'
        tags:
            - { name: kernel.event_listener, event: kernel.exception }

    App\ImageProcessing\Word\WordImageProcessor:
        arguments:
            $wordImageUploadDir: '%word_image_upload_dir%'
            $wordImageUploadDirRelative: '%word_image_upload_dir_relative%'
            $wordImageUploadDirTemp: '%word_image_upload_dir_temp%'

    Gemini\Client:
        factory: ['Gemini', 'client']
        arguments:
            - '%env(GEMINI_API_KEY)%'

    App\Service\AI\GeminiSdkClient:
      arguments:
        $client: '@Gemini\Client'

    App\Service\AI\GeminiClientInterface: '@App\Service\AI\GeminiSdkClient'

    App\Service\AI\GeminiService:
        arguments:
            $geminiClient: '@App\Service\AI\GeminiClientInterface'
            $logger: '@logger'
            $modelName: 'gemini-2.5-flash-lite'

    App\Service\AI\AIGeneratorInterface: '@App\Service\AI\GeminiService'
    App\Service\Word\WordCategoryServiceInterface: '@App\Service\Word\WordCategoryService'
    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
